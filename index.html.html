<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema de Blends - Carbonífera Catarinense</title>
    
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #e67e22;
            --success: #27ae60;
            --danger: #e74c3c;
            --light: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 15px;
            color: var(--primary);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            border-bottom: 3px solid var(--accent);
            margin-bottom: 25px;
            padding-bottom: 10px;
        }

        /* Estilo das Tabelas */
        .table-responsive { overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background: var(--primary); color: white; }
        tr:nth-child(even) { background: #f9f9f9; }

        /* Inputs */
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .resumo-card {
            background: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .resumo-item span { display: block; font-size: 0.9em; opacity: 0.8; }
        .resumo-item strong { font-size: 1.3em; color: var(--accent); }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        .btn-save { background: var(--success); color: white; }
        .btn-save:hover { background: #219150; }
        
        #historySection {
            margin-top: 30px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        .history-item {
            background: #fff;
            border-left: 5px solid var(--accent);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Tela de Login */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary); display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .login-card { background: white; padding: 40px; border-radius: 12px; text-align: center; width: 300px; }

        @media (max-width: 600px) {
            th, td { padding: 8px; font-size: 12px; }
            .container { padding: 10px; }
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-card">
            <h2>Acesso Blend</h2>
            <input type="text" id="userLogin" placeholder="Nome do Usuário" style="margin-bottom: 20px;">
            <button class="btn btn-save" onclick="fazerLogin()">Entrar</button>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>Gerador de Blends</h1>
            <p id="welcomeMsg"></p>
        </div>

        <div class="input-group">
            <label><strong>Número do Lote:</strong></label>
            <input type="text" id="numeroLote" placeholder="Ex: LOTE 001/24">
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Material</th>
                        <th>Quant (t)</th>
                        <th>PCS (kcal/kg)</th>
                        <th>Cinza (%)</th>
                        <th>Umidade (%)</th>
                        <th>Enxofre (%)</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    </tbody>
            </table>
        </div>

        <div class="resumo-card">
            <div class="resumo-item"><span>Total Ton</span><strong id="resTotalTon">0.00</strong></div>
            <div class="resumo-item"><span>Média PCS</span><strong id="resPCS">0</strong></div>
            <div class="resumo-item"><span>Média Cinza</span><strong id="resCinza">0.00</strong></div>
            <div class="resumo-item"><span>Média Enxofre</span><strong id="resEnxofre">0.00</strong></div>
        </div>

        <button class="btn btn-save" onclick="salvarFirebase()">💾 Salvar e Sincronizar Mobile</button>

        <div id="historySection">
            <h3>Histórico Sincronizado (Nuvem)</h3>
            <div id="listaFirebase">
                <p>Carregando dados em tempo real...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD1SlXItIwJPSucfWExeikNoqUJq72OGD8",
            authDomain: "blend-catarinense-c6a8a.firebaseapp.com",
            projectId: "blend-catarinense-c6a8a",
            storageBucket: "blend-catarinense-c6a8a.firebasestorage.app",
            messagingSenderId: "79336516969",
            appId: "1:79336516969:web:78c1995f50f75743f9a715"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db; // Global para funções externas

        // Escutador em tempo real
        const q = query(collection(db, "historico_lotes"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const lista = document.getElementById('listaFirebase');
            lista.innerHTML = "";
            snapshot.forEach((d) => {
                const data = d.data();
                lista.innerHTML += `
                    <div class="history-item">
                        <div>
                            <strong>${data.lote}</strong> - ${data.dataHora}<br>
                            <small>PCS: ${data.pcs} | Cinza: ${data.cinza}% | Por: ${data.usuario}</small>
                        </div>
                        <button onclick="excluirLote('${d.id}')" style="background:none; border:none; cursor:pointer;">❌</button>
                    </div>`;
            });
        });
    </script>

    <script>
        // LÓGICA DE CÁLCULO (O que estava no seu blend.txt)
        const materiais = ["Carvão Energético", "Cinza Pesada", "Cinza Volante", "Aditivo"];
        
        function inicializarTabela() {
            const corpo = document.getElementById('corpoTabela');
            materiais.forEach((mat, index) => {
                corpo.innerHTML += `
                    <tr>
                        <td style="text-align:left">${mat}</td>
                        <td><input type="number" class="calc-input q-${index}" oninput="calcular()" value="0"></td>
                        <td><input type="number" class="calc-input p-${index}" oninput="calcular()" value="0"></td>
                        <td><input type="number" class="calc-input c-${index}" oninput="calcular()" value="0"></td>
                        <td><input type="number" class="calc-input u-${index}" oninput="calcular()" value="0"></td>
                        <td><input type="number" class="calc-input e-${index}" oninput="calcular()" value="0"></td>
                    </tr>`;
            });
        }

        function calcular() {
            let totalTons = 0, somaPCS = 0, somaCinza = 0, somaEnxofre = 0;

            for(let i=0; i<materiais.length; i++) {
                let q = parseFloat(document.querySelector(`.q-${i}`).value) || 0;
                let p = parseFloat(document.querySelector(`.p-${i}`).value) || 0;
                let c = parseFloat(document.querySelector(`.c-${i}`).value) || 0;
                let e = parseFloat(document.querySelector(`.e-${i}`).value) || 0;

                totalTons += q;
                somaPCS += (q * p);
                somaCinza += (q * c);
                somaEnxofre += (q * e);
            }

            document.getElementById('resTotalTon').innerText = totalTons.toFixed(2);
            document.getElementById('resPCS').innerText = totalTons > 0 ? Math.round(somaPCS / totalTons) : 0;
            document.getElementById('resCinza').innerText = totalTons > 0 ? (somaCinza / totalTons).toFixed(2) : "0.00";
            document.getElementById('resEnxofre').innerText = totalTons > 0 ? (somaEnxofre / totalTons).toFixed(2) : "0.00";
        }

        async function salvarFirebase() {
            const lote = document.getElementById('numeroLote').value;
            if(!lote) return alert("Digite o número do lote!");

            const dados = {
                lote: lote,
                pcs: document.getElementById('resPCS').innerText,
                cinza: document.getElementById('resCinza').innerText,
                usuario: localStorage.getItem('usuario'),
                dataHora: new Date().toLocaleString(),
                timestamp: new Date().getTime()
            };

            try {
                // Import dinâmico para garantir que o db já existe
                const { collection, addDoc } = await import("https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js");
                await addDoc(collection(window.db, "historico_lotes"), dados);
                alert("✅ Sincronizado!");
            } catch (e) { alert("Erro ao salvar: " + e.message); }
        }

        async function excluirLote(id) {
            if(confirm("Excluir definitivamente?")) {
                const { doc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js");
                await deleteDoc(doc(window.db, "historico_lotes", id));
            }
        }

        function fazerLogin() {
            const user = document.getElementById('userLogin').value;
            if(user) {
                localStorage.setItem('usuario', user);
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('welcomeMsg').innerText = "Operador: " + user;
            }
        }

        window.onload = () => {
            inicializarTabela();
            if(localStorage.getItem('usuario')) {
                document.getElementById('userLogin').value = localStorage.getItem('usuario');
                fazerLogin();
            }
        }
    </script>
</body>
</html>
